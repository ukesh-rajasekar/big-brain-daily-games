<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Today's Puzzle</title>
<script>
/* ============================================================
   EDIT THIS PART — everything personal lives here
   ============================================================ */
const CONFIG = {
  herName: "Rithu",
  rainEmoji: "🫦",                   // falls like confetti when she solves the word

  wordle: {
    answer: "HEART",                 // any 4–7 letter word
    hint: "Hint: it's what you stole from me.",   // shown if she uses all 6 tries
    winText: "Got it. One last thing…"
  },

  finale: {
    lead: "I have one more question for you…",
    lines: ["RITHU", "NARENDRA", "WILL YOU", "MARRY", "ME?"],   // shown as tiles, one row per line
    hearts: ["❤️", "💖", "💗", "💕", "💘"],
    yesText: "She said YES! 💍"
  },

  music: { youtubeId: "Bcp0Jp_MUYU" }   // plays in the background once she taps Play
};
</script>
<style>
  :root{--green:#4f9d69;--yellow:#e0b44c;--grey:#74777a;--line:#d6d8dc;--ink:#18181a;--hdr:56px;--pad:16px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%;-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100vh;min-height:100dvh;font-family:"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:#fff;display:flex;flex-direction:column;transition:background .8s,color .8s}
  @media (max-width:360px){:root{--pad:12px}}

  /* ---------- shell ---------- */
  header{position:sticky;top:0;z-index:20;height:var(--hdr);background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad);flex:none;transition:background .8s,border-color .8s}
  header h1{font:700 clamp(18px,5vw,24px) Georgia,"Times New Roman",serif;margin:0;letter-spacing:.3px;transition:opacity 1s}
  main{position:relative;z-index:2;width:100%;max-width:1000px;margin:0 auto;flex:1;padding:var(--pad);padding-bottom:max(var(--pad),env(safe-area-inset-bottom));display:flex;flex-direction:column}
  .screen{display:none;width:100%;flex:1;flex-direction:column;align-items:center;gap:14px}
  .screen.on{display:flex}
  .screen.mid{justify-content:center}
  h2{font:700 clamp(22px,5vw,28px) Georgia,serif;margin:4px 0 0;text-align:center}
  p.sub{margin:0;color:#555;text-align:center;line-height:1.45;font-size:clamp(14px,3.8vw,16px);max-width:520px}
  .btn{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:13px 32px;min-height:48px;font-size:17px;font-weight:700;cursor:pointer}
  .btn.green{background:var(--green)}
  .chip{background:transparent;color:inherit;border:1px solid currentColor;border-radius:999px;padding:6px 14px;min-height:34px;font-size:14px;font-weight:700;cursor:pointer}
  .msg{min-height:22px;font-weight:700;font-size:14px;text-align:center}
  .msg:not(:empty){background:var(--ink);color:#fff;padding:9px 14px;border-radius:6px}
  .win{display:none}
  .win.on{display:flex;position:fixed;inset:0;z-index:40;background:rgba(255,255,255,.96);flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;animation:fade .4s}
  .win b{font:700 clamp(22px,6vw,30px)/1.25 Georgia,serif;text-align:center;max-width:460px}
  @keyframes fade{from{opacity:0}}

  /* ---------- tiles ---------- */
  .board{--rows:6;--chrome:340px;display:grid;gap:5px}
  #qBoard{--chrome:300px}
  .trow{display:flex;gap:5px;justify-content:center}
  .tile{--s:max(34px,min(64px,calc((100vw - 2*var(--pad) - 24px)/var(--n,5)),calc((100dvh - var(--hdr) - var(--chrome))/var(--rows))));width:var(--s);height:var(--s);border:2px solid var(--line);display:grid;place-items:center;font-size:calc(var(--s)*.52);font-weight:700;text-transform:uppercase;user-select:none}
  .tile.gap{border-color:transparent;width:calc(var(--s)*.45)}
  .tile.filled{border-color:#878a8c}
  .tile.pop{animation:pop .1s}
  .tile.flip{animation:flip .5s ease forwards}
  .tile.correct{background:var(--green);border-color:var(--green);color:#fff}
  .tile.present{background:var(--yellow);border-color:var(--yellow);color:#fff}
  .tile.absent{background:var(--grey);border-color:var(--grey);color:#fff}
  @keyframes pop{50%{transform:scale(1.1)}}
  @keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
  .shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

  /* ---------- keyboard ---------- */
  .kb{width:100%;max-width:520px;display:flex;flex-direction:column;gap:6px;margin-top:2px}
  .kbrow{display:flex;gap:5px;justify-content:center}
  .key{flex:1;max-width:46px;height:clamp(44px,6.6dvh,58px);border:0;border-radius:6px;background:#d3d6da;font-weight:700;font-size:clamp(12px,3.4vw,15px);cursor:pointer;padding:0;color:var(--ink);touch-action:manipulation}
  .key.wide{max-width:68px;flex:1.6;font-size:11px}
  .key:active{filter:brightness(.92)}
  .key.correct{background:var(--green);color:#fff}.key.present{background:var(--yellow);color:#fff}.key.absent{background:var(--grey);color:#fff}

  /* ---------- proposal ---------- */
  #question{display:flex;flex-direction:column;align-items:center;gap:18px}
  #yesrow{display:none;gap:12px;flex-wrap:wrap;justify-content:center}
  #yesmsg{font:700 clamp(28px,8vw,44px) Georgia,serif;text-align:center;display:none}
  #lead{opacity:0;transition:opacity 1.5s;color:#dfe8ff;font-size:clamp(16px,4.4vw,20px)}
  #lead.on{opacity:1}
  #rain{position:fixed;inset:0;pointer-events:none;width:100%;height:100%;z-index:46}
  #sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:0;pointer-events:none;transition:opacity 2.4s ease}
  body.night{background:#050a1c;color:#fff}
  body.night #sky{opacity:1}
  body.night header{background:transparent;border-color:transparent}
  body.night header h1{opacity:0}
  body.night .tile.correct{background:#f0c14b;border-color:#f0c14b;color:#1a1f4a}
  #ytbox{position:fixed;left:0;bottom:0;width:220px;height:124px;opacity:.01;pointer-events:none;z-index:-1;overflow:hidden}
  .nametiles .tile{--s:min(58px,calc((100vw - 2*var(--pad) - 24px)/5))}
</style>
</head>
<body>
<header>
  <h1>Today's Puzzle</h1>
  <button class="chip" id="musicBtn" hidden>♪ On</button>
</header>
<canvas id="sky"></canvas>
<main>
  <section class="screen mid" id="intro">
    <div class="board nametiles" id="nameTiles"></div>
    <h2 id="hello">A little game for you</h2>
    <p class="sub">Guess the hidden word in six tries. Turn your sound on. 🔊</p>
    <button class="btn" id="startBtn">Play</button>
  </section>

  <section class="screen" id="wordle">
    <h2>Guess the word</h2>
    <div class="msg" id="wMsg"></div>
    <div class="board" id="wBoard"></div>
    <div class="win" id="wWin"><b></b><button class="btn green">Continue →</button></div>
    <div class="kb" id="wKb"></div>
  </section>

  <section class="screen mid" id="finale">
    <p class="sub" id="lead"></p>
    <div id="question">
      <div class="board" id="qBoard"></div>
      <div id="yesrow"><button class="btn green">YES!</button><button class="btn green">Obviously yes!</button></div>
      <div id="yesmsg"></div>
    </div>
  </section>
</main>
<canvas id="rain"></canvas>
<div id="ytbox" aria-hidden="true"><div id="ytp"></div></div>

<script>
const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const ORDER = ['intro','wordle','finale'];
let activeKey = null;
const started = {};
const KEYS = {};

function show(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === name));
  activeKey = null;
  document.querySelectorAll('.win').forEach(w => w.classList.remove('on'));
  if (!started[name]) { started[name] = true; INIT[name](); } else if (KEYS[name]) activeKey = KEYS[name];
  window.scrollTo(0,0);
}
function win(prefix, text){
  activeKey = null;
  const w = $('#'+prefix+'Win'); w.querySelector('b').textContent = text;
  w.querySelector('button').onclick = () => { w.classList.remove('on'); rain.stop && rain.stop(); show(ORDER[ORDER.indexOf(document.querySelector('.screen.on').id) + 1]); };
  setTimeout(() => { w.classList.add('on'); rain(CONFIG.rainEmoji || '🫦'); }, 1100);
}
function flash(id, text, ms=1800){ const m = $(id); m.textContent = text; clearTimeout(m._t); if (ms) m._t = setTimeout(() => m.textContent = '', ms); }

/* ---------- falling emoji ---------- */
let rainId = 0;
function rain(chars, opt){
  opt = opt || {}; const list = Array.isArray(chars) ? chars : [chars];
  const cv = $('#rain'), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); cancelAnimationFrame(rainId);
  const mk = fresh => ({ch:list[Math.random()*list.length|0], x:Math.random()*W, y: fresh ? -30 : -30 - Math.random()*H*.9, s:24 + Math.random()*30, vy:2.2 + Math.random()*3.4, vx:-.6 + Math.random()*1.2, r:Math.random()*6.28, vr:-.04 + Math.random()*.08});
  const P = Array.from({length: opt.count || 48}, () => mk(false));
  rain.stop = () => { cancelAnimationFrame(rainId); ctx.clearRect(0,0,W,H); };
  (function loop(){
    ctx.clearRect(0,0,W,H); let alive = 0;
    P.forEach((p,i) => { p.y += p.vy; p.x += p.vx; p.r += p.vr;
      if (p.y > H + 50){ if (opt.loop) P[i] = mk(true); } else alive++;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.font = p.s + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(p.ch,0,0); ctx.restore(); });
    if (alive || opt.loop) rainId = requestAnimationFrame(loop); else ctx.clearRect(0,0,W,H);
  })();
}

/* ---------- background song (YouTube player, started by her first tap) ---------- */
const music = {player:null, ready:false, want:false, on:false, begun:false};
function musicLabel(){ const b = $('#musicBtn'); b.hidden = false; b.textContent = music.on ? '♪ On' : '♪ Off'; }
function startMusic(){
  if (music.begun) return; music.begun = true; music.want = true;
  window.onYouTubeIframeAPIReady = () => {
    music.player = new YT.Player('ytp', { width:220, height:124, videoId:CONFIG.music.youtubeId,
      playerVars:{ playsinline:1, controls:0, rel:0, loop:1, playlist:CONFIG.music.youtubeId, modestbranding:1 },
      events:{
        onReady: () => { music.ready = true; if (music.want) music.player.playVideo(); },
        onStateChange: e => { music.on = e.data === 1; musicLabel(); },
        onError: () => { const b = $('#musicBtn'); b.hidden = false; b.textContent = '♪ Open song'; b.onclick = () => window.open('https://www.youtube.com/watch?v=' + CONFIG.music.youtubeId, '_blank'); }
      } });
  };
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.append(s);
  musicLabel();
}
$('#musicBtn').onclick = () => { if (!music.ready) return; if (music.on){ music.want = false; music.player.pauseVideo(); } else { music.want = true; music.player.playVideo(); } };
// some phones only allow sound from a direct tap, so any tap nudges it to play
document.addEventListener('pointerdown', () => { if (music.ready && music.want && !music.on) music.player.playVideo(); });

/* ---------- live starry night ---------- */
function startSky(){
  const cv = $('#sky'), ctx = cv.getContext('2d'), still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, m, dpr, stars, bigStars, last = 0, t = 0, shoot = null, nextShoot = 3;
  function size(){ dpr = Math.min(window.devicePixelRatio || 1, 1.5); W = innerWidth; H = innerHeight; m = Math.min(W,H); cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    stars = Array.from({length: Math.round(W*H/8000)}, () => ({x:Math.random()*W, y:Math.random()*H*.86, r:.5 + Math.random()*1.5, p:Math.random()*6.28, s:.8 + Math.random()*2.2}));
    bigStars = [[.14,.17],[.31,.09],[.52,.2],[.7,.11],[.88,.31],[.4,.34],[.09,.42],[.64,.42],[.93,.1],[.24,.3],[.5,.07]].map(([a,b]) => ({x:a*W, y:b*H, r:m*(.016 + Math.random()*.012), p:Math.random()*6.28})); }
  function band(i){ const y0 = H*(.1 + i*.075); ctx.beginPath();
    for (let x = -20; x <= W + 20; x += 14){ const y = y0 + Math.sin(x*.006 + t*.35 + i)*H*.04 + Math.sin(x*.017 - t*.5 + i*2)*H*.014; x === -20 ? ctx.moveTo(x,y) : ctx.lineTo(x,y); }
    ctx.strokeStyle = i % 2 ? 'rgba(120,170,245,.10)' : 'rgba(170,205,255,.09)'; ctx.lineWidth = m*(.022 + (i%3)*.012); ctx.lineCap = 'round'; ctx.stroke(); }
  function spiral(cx, cy, base, dir){
    for (let k = 0; k < 10; k++){ const r = base*(.14 + k*.095), a0 = dir*t*.25 + k*.5;
      ctx.beginPath(); ctx.arc(cx, cy, r, a0, a0 + Math.PI*1.45); ctx.strokeStyle = 'rgba(195,222,255,' + (.15 - k*.008) + ')'; ctx.lineWidth = m*.011; ctx.stroke(); } }
  function moon(){ const x = W*.85, y = H*.15, r = m*.07, pulse = 1 + Math.sin(t*1.2)*.04;
    for (let k = 3; k >= 1; k--){ ctx.beginPath(); ctx.arc(x, y, r*(1 + k*.55)*pulse, 0, 7); ctx.fillStyle = 'rgba(255,220,120,' + (.05 + (3-k)*.02) + ')'; ctx.fill(); }
    ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,H); ctx.arc(x + r*.45, y - r*.15, r*.86, 0, 7, true); ctx.clip(); ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = '#ffd860'; ctx.fill(); ctx.restore(); }
  function bigStar(s){ const tw = .75 + .25*Math.sin(t*1.4 + s.p);
    const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r*3.4); g.addColorStop(0, 'rgba(255,235,140,' + (.75*tw) + ')'); g.addColorStop(1, 'rgba(255,235,140,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, s.r*3.4, 0, 7); ctx.fill();
    for (let k = 1; k <= 3; k++){ ctx.beginPath(); ctx.arc(s.x, s.y, s.r*(.9 + k*.55), 0, 7); ctx.strokeStyle = 'rgba(255,230,140,' + (.22*tw/k) + ')'; ctx.lineWidth = 1.4; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r*.55, 0, 7); ctx.fillStyle = '#fff3b8'; ctx.fill(); }
  function frame(now){
    const dt = Math.min(.05, (now - last)/1000 || 0); last = now; if (!still) t += dt;
    const bg = ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#0a1640'); bg.addColorStop(.5,'#1b3d92'); bg.addColorStop(.85,'#12256a'); bg.addColorStop(1,'#080e2c'); ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
    for (let i = 0; i < 9; i++) band(i);
    spiral(W*.62, H*.3, m*.2, 1); spiral(W*.27, H*.25, m*.14, -1);
    stars.forEach(s => { const a = .45 + .55*Math.sin(t*s.s + s.p); ctx.fillStyle = 'rgba(255,246,207,' + Math.max(.1,a) + ')'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); });
    bigStars.forEach(bigStar); moon();
    if (!shoot && t > nextShoot){ shoot = {x:Math.random()*W*.7, y:Math.random()*H*.3, p:0}; }
    if (shoot){ shoot.p += dt*1.1; const len = m*.22, x = shoot.x + shoot.p*W*.4, y = shoot.y + shoot.p*H*.18; const g = ctx.createLinearGradient(x, y, x - len, y - len*.45); g.addColorStop(0,'rgba(255,255,255,.9)'); g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x - len, y - len*.45); ctx.stroke(); if (shoot.p > 1){ shoot = null; nextShoot = t + 5 + Math.random()*6; } }
    ctx.beginPath(); ctx.moveTo(0,H); for (let x = 0; x <= W; x += 16) ctx.lineTo(x, H*.91 + Math.sin(x*.004)*H*.03 + Math.sin(x*.011 + 1)*H*.014); ctx.lineTo(W,H); ctx.closePath(); ctx.fillStyle = '#04081a'; ctx.fill();
    for (let i = 0; i < 14; i++){ const x = (i*97 % 100)/100*W, y = H*.955 + ((i*37)%5)*H*.006; ctx.fillStyle = 'rgba(255,200,90,' + (.5 + .4*Math.sin(t*.8 + i*3)) + ')'; ctx.fillRect(x, y, 3, 3); }
    if (!still) requestAnimationFrame(frame);
  }
  size(); window.addEventListener('resize', () => { size(); if (still) frame(performance.now()); }); requestAnimationFrame(frame);
}

function buildKb(box, onKey){
  box.innerHTML = '';
  ['QWERTYUIOP','ASDFGHJKL','↵ZXCVBNM⌫'].forEach(r => {
    const row = el('div','kbrow');
    [...r].forEach(k => {
      const b = el('button','key' + ('↵⌫'.includes(k) ? ' wide' : ''), k === '↵' ? 'ENTER' : k);
      b.dataset.k = k;
      b.onclick = () => { b.blur(); onKey(k === '↵' ? 'Enter' : k === '⌫' ? 'Backspace' : k); };
      row.append(b);
    });
    box.append(row);
  });
}
document.addEventListener('keydown', e => {
  if (!activeKey || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[a-zA-Z]$/.test(e.key)) activeKey(e.key.toUpperCase());
  else if (['Enter','Backspace'].includes(e.key)) { e.preventDefault(); activeKey(e.key); }
});

const INIT = {
  intro(){
    if (CONFIG.herName) $('#hello').textContent = `A little game for you, ${CONFIG.herName}`;
    const box = $('#nameTiles'), tr = el('div','trow'); box.style.setProperty('--n', 5); box.style.setProperty('--rows', 1);
    [...(CONFIG.herName || 'HELLO').toUpperCase().slice(0,7)].forEach((ch,i) => { const t = el('div','tile correct', ch); tr.append(t); });
    box.append(tr);
    $('#startBtn').onclick = () => { startMusic(); show('wordle'); };
  },

  /* ---------------- WORDLE ---------------- */
  wordle(){
    const ans = CONFIG.wordle.answer.toUpperCase(), n = ans.length, R = 6;
    const board = $('#wBoard'); board.style.setProperty('--n', n);
    let row = 0, cur = '', busy = false, rows = [];
    function build(){ board.innerHTML = ''; rows = []; row = 0; cur = '';
      for (let r = 0; r < R; r++){ const tr = el('div','trow'); const ts = []; for (let i = 0; i < n; i++){ const t = el('div','tile'); tr.append(t); ts.push(t); } board.append(tr); rows.push({tr, ts}); } }
    function paint(){ rows[row].ts.forEach((t,i) => { t.textContent = cur[i] || ''; t.classList.toggle('filled', !!cur[i]); }); }
    function score(g){ const res = Array(n).fill('absent'), cnt = {};
      for (let i = 0; i < n; i++){ if (g[i] === ans[i]) res[i] = 'correct'; else cnt[ans[i]] = (cnt[ans[i]]||0) + 1; }
      for (let i = 0; i < n; i++){ if (res[i] !== 'correct' && cnt[g[i]] > 0){ res[i] = 'present'; cnt[g[i]]--; } }
      return res; }
    function submit(){
      busy = true; const g = cur, res = score(g), ts = rows[row].ts;
      ts.forEach((t,i) => setTimeout(() => { t.classList.add('flip'); setTimeout(() => t.classList.add(res[i]), 250); }, i*280));
      setTimeout(() => {
        [...g].forEach((ch,i) => { const k = $(`#wKb [data-k="${ch}"]`); if (!k) return;
          if (res[i] === 'correct') k.className = 'key correct';
          else if (res[i] === 'present' && !k.classList.contains('correct')) k.className = 'key present';
          else if (res[i] === 'absent' && !k.classList.contains('correct') && !k.classList.contains('present')) k.className = 'key absent'; });
        if (g === ans) return win('w', CONFIG.wordle.winText);
        row++; cur = '';
        if (row === R){ flash('#wMsg', CONFIG.wordle.hint || 'So close. Try again!', 0); setTimeout(() => { build(); busy = false; }, 1600); }
        else busy = false;
      }, n*280 + 400);
    }
    KEYS.wordle = activeKey = k => {
      if (busy) return;
      if (k === 'Backspace') cur = cur.slice(0,-1);
      else if (k === 'Enter'){ if (cur.length < n){ flash('#wMsg','Not enough letters'); rows[row].tr.classList.remove('shake'); void rows[row].tr.offsetWidth; rows[row].tr.classList.add('shake'); } else return submit(); }
      else if (k.length === 1 && cur.length < n){ cur += k; const t = rows[row].ts[cur.length-1]; t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop'); }
      paint();
    };
    build(); buildKb($('#wKb'), k => activeKey && activeKey(k));
  },

  /* ---------------- THE QUESTION ---------------- */
  finale(){
    const F = CONFIG.finale, board = $('#qBoard');
    document.body.classList.add('night'); startSky();
    $('#lead').textContent = F.lead; setTimeout(() => $('#lead').classList.add('on'), 900);
    board.style.setProperty('--n', Math.max(...F.lines.map(l => l.length))); board.style.setProperty('--rows', F.lines.length);
    let t = 2200;
    F.lines.forEach(line => { const tr = el('div','trow');
      [...line.toUpperCase()].forEach(ch => { const tile = el('div', ch === ' ' ? 'tile gap' : 'tile'); tr.append(tile);
        if (ch !== ' '){ setTimeout(() => { tile.classList.add('flip'); setTimeout(() => { tile.textContent = ch; tile.classList.add('correct'); }, 250); }, t); t += 200; } });
      board.append(tr); t += 200; });
    setTimeout(() => rain(F.hearts, {loop:true, count:34}), 1500);
    setTimeout(() => { $('#yesrow').style.display = 'flex'; }, t + 600);
    $('#yesrow').querySelectorAll('button').forEach(b => b.onclick = () => {
      $('#yesrow').style.display = 'none'; const m = $('#yesmsg'); m.textContent = F.yesText; m.style.display = 'block'; rain(F.hearts, {loop:true, count:110}); });
  }
};

// For your own testing: add ?stage=finale to the address to jump straight to the question.
const jump = new URLSearchParams(location.search).get('stage');
if (jump === 'finale') startMusic();
show(ORDER.includes(jump) ? jump : 'intro');
</script>
