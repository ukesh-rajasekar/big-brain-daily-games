   ============================================================ */

  herName: "Rithu",
  rainEmoji: "🫦",                   // falls like confetti when she solves the word

  wordle: {
    answer: "HEART",                 // any 4–7 letter word
    hint: "Hint: it's what you stole from me.",   // shown if she uses all 6 tries
  },

  finale: {
    lines: ["RITHU", "NARENDRA", "WILL YOU", "MARRY", "ME?"],   // shown as tiles, one row per line
    hearts: ["❤️", "💖", "💗", "💕", "💘"],
    zoomStartMs: 1800,                 // how long the starry night is shown before the camera starts moving in
    zoomMs: 4200,                      // length of the zoom into the village street
    letterMs: 140                      // time between flags popping onto the banner (smaller = faster)
  },

  dog: { caption: "Wow kya ladki hai 😍", sub: "Very handsome girl!" },   // shown with the dog when she solves the word

  music: {
    dog:      { id: "gotBwcBa4Vo", start: 1 },   // plays while the dog is on screen

<style>
  :root{--green:#4f9d69;--yellow:#e0b44c;--grey:#74777a;--line:#d6d8dc;--ink:#18181a;--hdr:56px;--pad:16px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%;-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100vh;min-height:100dvh;font-family:"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:#fff;display:flex;flex-direction:column;transition:background .8s,color .8s}
  @media (max-width:360px){:root{--pad:12px}}

  /* ---------- shell ---------- */
  header{position:sticky;top:0;z-index:20;height:var(--hdr);background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad);flex:none;transition:background .8s,border-color .8s}
  header h1{font:700 clamp(18px,5vw,24px) Georgia,"Times New Roman",serif;margin:0;letter-spacing:.3px;transition:opacity 1s}
  main{position:relative;z-index:2;width:100%;max-width:1000px;margin:0 auto;flex:1;padding:var(--pad);padding-bottom:max(var(--pad),env(safe-area-inset-bottom));display:flex;flex-direction:column}
  .screen{display:none;width:100%;flex:1;flex-direction:column;align-items:center;gap:14px}
  .screen.on{display:flex}
  .screen.mid{justify-content:center}
  h2{font:700 clamp(22px,5vw,28px) Georgia,serif;margin:4px 0 0;text-align:center}
  p.sub{margin:0;color:#555;text-align:center;line-height:1.45;font-size:clamp(14px,3.8vw,16px);max-width:520px}
  .btn{background:var(--ink);color:#fff;border:0;border-radius:999px;padding:13px 32px;min-height:48px;font-size:17px;font-weight:700;cursor:pointer}
  .btn.green{background:var(--green)}
  .chip{background:transparent;color:inherit;border:1px solid currentColor;border-radius:999px;padding:6px 14px;min-height:34px;font-size:14px;font-weight:700;cursor:pointer}
  .msg{min-height:22px;font-weight:700;font-size:14px;text-align:center}
  .msg:not(:empty){background:var(--ink);color:#fff;padding:9px 14px;border-radius:6px}
  .win{display:none}
  .win.on{display:flex;position:fixed;inset:0;z-index:40;background:rgba(255,255,255,.96);flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;animation:fade .4s}
  .win b{font:700 clamp(22px,6vw,30px)/1.25 Georgia,serif;text-align:center;max-width:460px}
  @keyframes fade{from{opacity:0}}

  /* ---------- tiles ---------- */
  .board{--rows:6;--chrome:340px;display:grid;gap:5px}
  #qBoard{--chrome:300px}
  .trow{display:flex;gap:5px;justify-content:center}
  .tile{--s:max(34px,min(64px,calc((100vw - 2*var(--pad) - 24px)/var(--n,5)),calc((100dvh - var(--hdr) - var(--chrome))/var(--rows))));width:var(--s);height:var(--s);border:2px solid var(--line);display:grid;place-items:center;font-size:calc(var(--s)*.52);font-weight:700;text-transform:uppercase;user-select:none}
  .tile.gap{border-color:transparent;width:calc(var(--s)*.45)}
  .tile.filled{border-color:#878a8c}
  .tile.pop{animation:pop .1s}
  .tile.flip{animation:flip .5s ease forwards}
  .tile.correct{background:var(--green);border-color:var(--green);color:#fff}
  .tile.present{background:var(--yellow);border-color:var(--yellow);color:#fff}
  .tile.absent{background:var(--grey);border-color:var(--grey);color:#fff}
  @keyframes pop{50%{transform:scale(1.1)}}
  @keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
  .shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

  /* ---------- keyboard ---------- */
  .kb{width:100%;max-width:520px;display:flex;flex-direction:column;gap:6px;margin-top:2px}
  .kbrow{display:flex;gap:5px;justify-content:center}
  .key{flex:1;max-width:46px;height:clamp(44px,6.6dvh,58px);border:0;border-radius:6px;background:#d3d6da;font-weight:700;font-size:clamp(12px,3.4vw,15px);cursor:pointer;padding:0;color:var(--ink);touch-action:manipulation}
  .key.wide{max-width:68px;flex:1.6;font-size:11px}
  .key:active{filter:brightness(.92)}
  .key.correct{background:var(--green);color:#fff}.key.present{background:var(--yellow);color:#fff}.key.absent{background:var(--grey);color:#fff}

  /* ---------- proposal ---------- */
  #question{display:flex;flex-direction:column;align-items:center;gap:18px}
  #lead{opacity:0;transition:opacity 1.5s;color:#dfe8ff;font-size:clamp(16px,4.4vw,20px)}
  #lead.on{opacity:1}
  #rain{position:fixed;inset:0;pointer-events:none;width:100%;height:100%;z-index:46}
  #sky,#skyfg{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:0;pointer-events:none;transition:opacity 1.2s ease}
  #skyfg{z-index:1;display:none}
  #skyfg.czoom{display:block}
  body.night{background:#050a1c;color:#fff}
  body.skyon #sky,body.skyon #skyfg{opacity:1}
  /* the WebGL sky moves its camera inside the shader (crisp at every zoom level); only the 2D fallback is zoomed with CSS */
  .czoom{transform-origin:63% 88%;transition:opacity 1.2s ease,transform 4.2s cubic-bezier(.5,.02,.2,1)}
  body.zoom .czoom{transform:scale(2.7)}
  #street{position:fixed;inset:0;width:100%;height:100%;z-index:1;opacity:0;pointer-events:none;transform-origin:63% 100%;will-change:opacity,transform}
  #question{position:relative}
  #question::before{content:'';position:absolute;inset:-48px -36px;background:radial-gradient(ellipse at center,rgba(3,8,30,.6),rgba(3,8,30,0) 72%);z-index:-1;pointer-events:none}
  body.night header{background:transparent;border-color:transparent}
  body.night header h1{opacity:0}
  body.night .tile.correct{background:linear-gradient(160deg,#ff6b97,#d81b60);border-color:rgba(255,255,255,.92);color:#fff;text-shadow:0 1px 3px rgba(60,0,25,.45);box-shadow:0 0 0 1px rgba(255,255,255,.3),0 8px 20px rgba(0,0,0,.45),0 0 24px rgba(255,90,140,.55)}
  #dog{position:fixed;inset:0;z-index:40;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;color:#fff;text-align:center}
  #dog.on{display:flex;animation:fade .4s}
  .dogbox{position:relative;overflow:hidden;width:min(78vw,calc(56dvh*.6585));aspect-ratio:540/820;animation:dogpop .8s cubic-bezier(.2,1.7,.4,1) both,dogwig 2.6s ease-in-out .9s infinite}
  .dogbox img{position:absolute;left:0;top:0;width:170.93%;margin-left:-37.04%;margin-top:-109.26%;max-width:none;display:block}
  .dogcap{opacity:0;animation:dogshow .6s ease .7s forwards}
  .dogcap b{display:block;font:700 clamp(24px,7vw,38px)/1.2 Georgia,serif}
  .dogcap span{display:block;margin-top:4px;font-size:clamp(16px,4.6vw,21px);color:#ffd0e2}
  #dogBtn{opacity:0;animation:dogshow .5s ease 2s forwards}
  @keyframes dogshow{to{opacity:1}}
  @keyframes dogpop{0%{transform:translateY(55vh) scale(.15) rotate(-14deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
  @keyframes dogwig{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
  #ytbox{position:fixed;left:0;bottom:0;width:220px;height:260px;opacity:.01;pointer-events:none;z-index:-1;overflow:hidden}
  .nametiles .tile{--s:min(58px,calc((100vw - 2*var(--pad) - 24px)/5))}
</style>
</head>

<script>
const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const ORDER = ['intro','wordle','finale'];
let activeKey = null;
const started = {};
const KEYS = {};

function show(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === name));
  activeKey = null;
  document.querySelectorAll('.win').forEach(w => w.classList.remove('on'));
  if (!started[name]) { started[name] = true; INIT[name](); } else if (KEYS[name]) activeKey = KEYS[name];
  window.scrollTo(0,0);
}
function win(prefix, text){
  activeKey = null;
  const w = $('#'+prefix+'Win'); w.querySelector('b').textContent = text;
  w.querySelector('button').onclick = () => { w.classList.remove('on'); rain.stop && rain.stop(); show(ORDER[ORDER.indexOf(document.querySelector('.screen.on').id) + 1]); };
  setTimeout(() => { w.classList.add('on'); rain(CONFIG.rainEmoji || '🫦'); }, 1100);
}
function dogMoment(){           // solved: the dog pops up with a song, and Continue leads to the question
  activeKey = null; playSong('dog');          // sound starts now, so it is already playing as the dog pops up
  setTimeout(() => {
    $('#dogCap').textContent = CONFIG.dog.caption; $('#dogSub').textContent = CONFIG.dog.sub;
    $('#dog').classList.add('on'); rain(CONFIG.rainEmoji || '🫦');
    $('#dogBtn').onclick = () => { $('#dog').classList.remove('on'); rain.stop && rain.stop(); playSong('proposal'); show('finale'); };
  }, 700);
}
function flash(id, text, ms=1800){ const m = $(id); m.textContent = text; clearTimeout(m._t); if (ms) m._t = setTimeout(() => m.textContent = '', ms); }

/* ---------- falling emoji ---------- */
let rainId = 0;
const SIZES = [24, 32, 40, 50], spriteCache = {};
const IS_APPLE = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent) || navigator.platform === 'MacIntel';
function drawLips(x, d){                 // original soft 3D-style lip bite (pink upper lip, salmon lower lip, one white tooth edge), used where there is no Apple emoji font
  x.save(); x.scale(d/100, d/100);
  const lg = (y0, y1, stops) => { const q = x.createLinearGradient(0,y0,0,y1); stops.forEach(([o,c]) => q.addColorStop(o,c)); return q; };
  x.fillStyle = lg(50,83,[[0,'#ffa9b3'],[.55,'#f98593'],[1,'#ee6c82']]);                                         // lower lip
  x.beginPath(); x.moveTo(5,55); x.quadraticCurveTo(50,49,95,55); x.quadraticCurveTo(85,83,50,83); x.quadraticCurveTo(15,83,5,55); x.fill();
  x.fillStyle = 'rgba(255,255,255,.24)'; x.beginPath(); x.ellipse(45,70,19,5,0,0,7); x.fill();                  // soft shine on lower lip
  x.fillStyle = '#16060c'; x.beginPath(); x.moveTo(44,53); x.quadraticCurveTo(76,52,93,56); x.quadraticCurveTo(75,65,47,60); x.closePath(); x.fill();   // dark gap
  x.fillStyle = lg(50,63,[[0,'#ffffff'],[1,'#d7d7df']]); x.beginPath(); x.moveTo(13,56); x.quadraticCurveTo(40,46,68,53); x.quadraticCurveTo(45,65,27,62); x.quadraticCurveTo(17,60,13,56); x.fill();   // tooth
  x.fillStyle = lg(30,56,[[0,'#ff90a6'],[.45,'#f35a7e'],[1,'#e3406b']]);                                         // upper lip
  x.beginPath(); x.moveTo(3,56); x.quadraticCurveTo(9,44,26,38); x.quadraticCurveTo(40,31,47,34); x.quadraticCurveTo(50,36,53,34); x.quadraticCurveTo(60,31,74,38); x.quadraticCurveTo(91,44,97,56);
  x.quadraticCurveTo(72,50,50,52); x.quadraticCurveTo(28,50,3,56); x.fill();
  x.fillStyle = 'rgba(255,255,255,.4)'; x.beginPath(); x.ellipse(29,42,10,2.8,-.45,0,7); x.fill(); x.beginPath(); x.ellipse(71,42,10,2.8,.45,0,7); x.fill();   // shine on upper lip
  x.restore(); }
function sprite(ch, s, dpr){            // each emoji is drawn once into a tiny canvas, then just stamped every frame (much faster on phones)
  const key = ch + s + '@' + dpr; if (spriteCache[key]) return spriteCache[key];
  const d = Math.ceil(s*1.4*dpr), c = document.createElement('canvas'); c.width = c.height = d; const x = c.getContext('2d');
  if (ch === '🫦' && !IS_APPLE){ x.translate(d*.5 - s*dpr*.5, d*.5 - s*dpr*.56); drawLips(x, s*dpr); return spriteCache[key] = c; }
  x.font = (s*dpr) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(ch, d/2, d/2 + s*dpr*.04);
  return spriteCache[key] = c; }
function rain(chars, opt){
  opt = opt || {}; const list = Array.isArray(chars) ? chars : [chars];
  const cv = $('#rain'), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  if (cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); }
  cancelAnimationFrame(rainId);
  const mk = fresh => ({ch:list[Math.random()*list.length|0], x:Math.random()*W, y: fresh ? -30 : -30 - Math.random()*H*.9, s:SIZES[Math.random()*SIZES.length|0], vy:2.2 + Math.random()*3.4, vx:-.6 + Math.random()*1.2, r:Math.random()*6.28, vr:-.04 + Math.random()*.08});
  const P = Array.from({length: opt.count || 48}, () => mk(false));
  P.forEach(p => sprite(p.ch, p.s, dpr));                                    // draw the emoji sprites now, not mid-animation
  const clear = () => { ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); };
  rain.stop = () => { cancelAnimationFrame(rainId); clear(); };
  let last = 0;
  (function loop(now){
    const k = last && now ? Math.min(3, (now - last)/16.67) : 1; last = now || 0;   // time-based: same speed at 30, 60 or 120 fps
    clear(); let alive = 0;
    for (let i = 0; i < P.length; i++){ let p = P[i]; p.y += p.vy*k; p.x += p.vx*k; p.r += p.vr*k;
      if (p.y > H + 50){ if (opt.loop) p = P[i] = mk(true); } else alive++;
      const sp = sprite(p.ch, p.s, dpr), d = p.s*1.4, c = Math.cos(p.r)*dpr, s = Math.sin(p.r)*dpr;
      ctx.setTransform(c, s, -s, c, p.x*dpr, p.y*dpr); ctx.drawImage(sp, -d/2, -d/2, d, d); }
    if (alive || opt.loop) rainId = requestAnimationFrame(loop); else clear();
  })();
}

/* ---------- background songs: both hidden YouTube players load on her first tap, so each song starts instantly ---------- */
const music = {want:false, cur:null, made:false, pl:{}};
function curPlayer(){ return music.cur && music.pl[music.cur]; }
function musicLabel(){ const b = $('#musicBtn'), st = curPlayer(); b.hidden = false; b.textContent = st && st.on ? '♪ On' : '♪ Off'; }
function loadSongs(){
  if (music.made) return; music.made = true;
  window.onYouTubeIframeAPIReady = () => {
    Object.keys(CONFIG.music).forEach(key => {
      const s = CONFIG.music[key], st = music.pl[key] = {p:null, ready:false, on:false};
      st.p = new YT.Player('yt_' + key, { width:220, height:124, videoId:s.id, playerVars:{ playsinline:1, controls:0, rel:0, modestbranding:1, start:s.start || 0 },
        events:{
          onReady: () => { st.ready = true; if (music.cur === key && music.want) st.p.playVideo(); },
          onStateChange: e => { st.on = e.data === 1; if (e.data === 0 && music.want && music.cur === key){ st.p.seekTo(s.start || 0, true); st.p.playVideo(); } musicLabel(); },
          onError: () => { const b = $('#musicBtn'); b.hidden = false; b.textContent = '♪ Open song'; b.onclick = () => window.open('https://www.youtube.com/watch?v=' + s.id, '_blank'); }
        } });
    });
  };
  const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api'; document.head.append(sc);
}
function playSong(key){
  loadSongs(); const prev = curPlayer(); if (prev && prev.ready && music.cur !== key) prev.p.pauseVideo();
  music.cur = key; music.want = true; musicLabel();
  const st = music.pl[key]; if (st && st.ready){ st.p.seekTo(CONFIG.music[key].start || 0, true); st.p.playVideo(); }
}
$('#musicBtn').onclick = () => { const st = curPlayer(); if (!st || !st.ready) return; if (st.on){ music.want = false; st.p.pauseVideo(); } else { music.want = true; st.p.playVideo(); } };
// some phones only allow sound from a direct tap, so any tap nudges it to play
document.addEventListener('pointerdown', () => { const st = curPlayer(); if (st && st.ready && music.want && !st.on) st.p.playVideo(); });

/* ---------- live painted starry night ----------
   Thousands of brush strokes ride a swirling flow field (big spiral currents, like oil paint in motion),
   with haloed stars, a crescent moon, a cypress tree and a village with lit windows on top. */
let skyRun = 0, SKYGL = null;
/* run fn in a fresh task soon (a MessageChannel is not clamped/throttled like setTimeout), so long preparation is split into short tasks */
const nextTask = (() => { const ch = new MessageChannel(), q = []; ch.port1.onmessage = () => { const f = q.shift(); if (f) f(); }; return f => { q.push(f); ch.port2.postMessage(0); }; })();
/* Heavy one-off work (shader compile + link on a background thread via KHR_parallel_shader_compile, a warm-up draw,
   a tiny GPU benchmark that picks the render resolution) happens here, ahead of time: it is started when she taps
   Play, so by the time the finale starts the sky is ready and the first frame costs no more than any other frame.
   Resolves true when the WebGL sky is ready, false when the 2D painter must be used. */
function prepareSky(){
  if (prepareSky.p) return prepareSky.p;
  return prepareSky.p = new Promise(res => {
    let settled = false; const done = ok => { if (!settled){ settled = true; if (!ok) SKYGL = null; res(ok); } };
    try { SKYGL = createSkyGL(done); if (!SKYGL) done(false); }
    catch (e) { console.warn('starry night: WebGL unavailable, using 2D painter', e); done(false); }
    let shown = 0; const wd = setInterval(() => {            // watchdog: 8s of visible time without being ready -> 2D painter (hidden tabs do not count)
      if (settled) return clearInterval(wd);
      if (!document.hidden && (shown += 500) >= 8000){ clearInterval(wd); console.warn('starry night: WebGL too slow to start, using 2D painter'); if (SKYGL) SKYGL.destroy(); done(false); } }, 500);
  });
}
function skyTo2D(){                       // swap to the 2D painter (no WebGL, failed compile, or lost context)
  const old = $('#sky'); if (old.dataset.gl){ const n = old.cloneNode(false); delete n.dataset.gl; old.replaceWith(n); }
  $('#sky').classList.add('czoom'); $('#skyfg').classList.add('czoom'); startSky2D();
}
function startSky(){ prepareSky().then(ok => { if (!ok) skyTo2D(); document.body.classList.add('skyon'); }); }

/* ----- WebGL painter: a fragment shader paints every pixel as layered, impasto brush strokes that ride a
   swirling flow field (great vortices + spinning star halos), with parallax hills, a lit village and a flame-like cypress. */
const SKY_HEAD = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 uR; uniform vec2 uE; uniform float uT; uniform float uF; uniform float uZ;
uniform vec2 uCam; uniform vec3 uPtr;
uniform vec4 uV[5]; uniform vec4 uS[11]; uniform vec3 uMoon;
uniform vec4 uG;  /* horizon y, wave y, cypress x, cypress height */
uniform vec4 uG2; /* cypress width, church x, -, - */
uniform float uZoom; uniform vec2 uZO;   /* camera zoom (1 = whole painting) and the point it moves toward */
const vec2 LGT = vec2(-0.6, 0.8);
/* how strongly each depth layer follows the camera: far sky least, cypress (closest) most, for a real dolly-in parallax */
const float KS = .82, KF = .93, KN = 1., KC = 1.3;
float gCx, gHw;
vec2 basePt(vec2 fc){ return (fc - .5*uR)/min(uR.x, uR.y)*uZ; }
vec2 zoomed(vec2 p, float k){ return uZO + (p - uZO)/(1. + (uZoom - 1.)*k); }
/* sky-layer point -> pixel (inverse of zoomed(basePt(fc), KS) + uCam*.3) */
vec2 skyPx(vec2 ps){ vec2 q = ps - uCam*.3; q = uZO + (q - uZO)*(1. + (uZoom - 1.)*KS); return q/uZ*min(uR.x, uR.y) + .5*uR; }

float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y)*p3.z); }
vec4 h42(vec2 p){ vec4 p4 = fract(vec4(p.xyxy)*vec4(.1031,.1030,.0973,.1099)); p4 += dot(p4, p4.wzxy + 33.33); return fract((p4.xxyz + p4.yzzw)*p4.zywx); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3. - 2.*f);
  return mix(mix(h12(i), h12(i + vec2(1.,0.)), f.x), mix(h12(i + vec2(0.,1.)), h12(i + vec2(1.,1.)), f.x), f.y); }

float hillF(float x){ return uG.x + .03 + .028*sin(x*2.3 + .6) + .013*sin(x*6.1 + 2.) + .07*smoothstep(-.3, 1.2, x/uE.x); }
float hillN(float x){ return uG.x - .065 + .02*sin(x*3.7 + 2.5) + .008*sin(x*11. + 1.); }
`;
/* pass 1 (low resolution): the sky's colour field and its flow direction, rendered to two small textures */
const SKY_FLOW = `
vec2 flow(vec2 p){
  vec2 v = vec2(1., .3*sin(p.x*2.7 + uF*.13) + .22*sin(p.y*4. - p.x*1.3 + uF*.1));
  for (int i = 0; i < 5; i++){ vec4 o = uV[i]; vec2 d = p - o.xy; float r2 = dot(d,d)/(o.z*o.z);
    if (r2 < 9.) v += o.w*vec2(-d.y, d.x)/o.z*exp(-r2)*2.; }
  for (int i = 0; i < 11; i++){ vec4 s = uS[i]; vec2 d = p - s.xy; float rr = s.z*3.2; float r2 = dot(d,d)/(rr*rr);
    if (r2 < 9.) v += 4.5*vec2(-d.y, d.x)/rr*exp(-r2); }
  vec2 d = p - uPtr.xy; v += uPtr.z*3.*vec2(-d.y, d.x)/.16*exp(-dot(d,d)/.0256);
  return normalize(v + 1e-5);
}
`;
const SKY_FIELD = SKY_FLOW + `
vec3 skyCol(vec2 p){
  float y01 = clamp((p.y - uG.x)/(uE.y - uG.x), 0., 1.);
  vec2 w = p + .07*vec2(vn(p*3.5 + uF*.04) - .5, vn(p*3.5 + 9.1 - uF*.04) - .5);
  vec3 c = mix(vec3(.40,.66,.90), vec3(.14,.33,.72), smoothstep(0., .3, y01));
  c = mix(c, vec3(.04,.09,.33), smoothstep(.3, 1., y01));
  float n = vn(w*vec2(2.5, 8.) + vec2(uF*.08, 0.));
  c *= .78 + .42*n;
  /* the great rolling wave across the sky */
  float yb = uG.y + .06*sin(w.x*3. + uF*.22) + .025*sin(w.x*7.3 - uF*.3);
  float bd = (w.y - yb)/.075; float band = exp(-bd*bd);
  c = mix(c, mix(vec3(.30,.58,.88), vec3(.86,.95,.98), smoothstep(-.2, .8, sin(bd*4.5 + w.x*3. - uF*.5))), band*.75);
  /* vortices: spiral arms of cyan / white / ultramarine */
  for (int i = 0; i < 5; i++){ vec4 o = uV[i]; vec2 d = w - o.xy; float r = length(d)/o.z;
    if (r < 1.7){ float sg = sign(o.w); float a = atan(d.y, d.x)*sg;
      float arm = sin(r*8.5 - a - uF*.9*sg + float(i));
      vec3 sc = mix(vec3(.10,.24,.62), vec3(.40,.72,.94), smoothstep(-.5, .3, arm));
      sc = mix(sc, vec3(.90,.96,.97), smoothstep(.55, .95, arm));
      if (i == 0) sc = mix(sc, vec3(.93,.90,.62), smoothstep(.85, 1., arm)*smoothstep(1.2, .4, r)*.8);
      sc = mix(sc, vec3(.70,.86,.96), smoothstep(.35, 0., r)*.7);
      c = mix(c, sc, smoothstep(1.7, .55, r)*min(1., abs(o.w)*.32 + .25)); } }
  /* breathing star halos */
  for (int i = 0; i < 11; i++){ vec4 s = uS[i]; vec2 d = w - s.xy; float r = length(d)/s.z;
    if (r < 4.2){ float fi = float(i); r /= 1. + .1*sin(uT*1.25 + fi*1.7);
      float ring = .5 + .5*cos(r*3.2 - uT*1.1 - fi);
      vec3 inner = mix(vec3(1.,.97,.80), vec3(1.,.84,.32), smoothstep(.4, 1.2, r));
      vec3 outer = mix(vec3(.90,.88,.50), vec3(.55,.80,.93), smoothstep(1.5, 3.2, r));
      if (s.w > .5){ inner = mix(inner, vec3(1.,.72,.25), .35); outer = mix(outer, vec3(.95,.80,.40), .35); }
      vec3 hc = mix(inner, outer, smoothstep(1., 1.8, r))*(.74 + .42*ring);
      c = mix(c, hc, (1. - smoothstep(2.1, 4.2, r))*.92); } }
  /* moon halo */
  { vec2 d = w - uMoon.xy; float r = length(d)/uMoon.z;
    if (r < 3.){ float ring = .5 + .5*cos(r*4.2 - uT*.8);
      vec3 hc = mix(vec3(.90,.48,.12), vec3(.98,.74,.30), smoothstep(1., 2.2, r))*(.72 + .36*ring);
      c = mix(c, hc, (1. - smoothstep(1.7, 3., r))*.92); } }
  return c;
}
void main(){
  vec2 p = zoomed(basePt(gl_FragCoord.xy), KS) + uCam*.3;
#ifdef DIR
  gl_FragColor = vec4(flow(p)*.5 + .5, 0., 1.);
#else
  gl_FragColor = vec4(skyCol(p), 1.);
#endif
}`;
/* pass 2 (full resolution, into a texture): the sky's base colour */
const SKY_BASE = `
uniform sampler2D uCol;
void main(){ gl_FragColor = vec4(texture2D(uCol, gl_FragCoord.xy/uR).rgb*.8, 1.); }`;
const SKY_TINT = `
vec3 tint(vec3 c, float j){ return c*(.84 + .32*j) + (j - .5)*vec3(-.05, .02, .07); }
`;
/* pass 3: the sky's brush strokes as real geometry. Each stroke is one small quad drawn in priority order with
   premultiplied blending, instead of every pixel searching 3 layers x 9 neighbouring cells for the top stroke
   (that search was ~75% of the GPU time). Same stroke shape, bristles, dry-brush tail and colours. */
const SKY_STROKE_VS = SKY_FLOW + `
attribute vec4 aC; attribute vec4 aH;
uniform float uCs, uSpd;
varying vec2 vL, vP, vCen; varying vec4 vS; varying vec2 vB;
void main(){
  vec4 h = aH;
  float ph = fract(uF*uSpd*(.6 + .8*h.z) + h.w);
  float life = .5 + .5*sin(3.14159*ph);
  vec2 c0 = (aC.xy + .5 + (h.xy - .5)*.9)*uCs;
  vec2 dir = flow(c0);
  vec2 c = c0 + dir*(ph - .5)*uCs*1.3;
  vec2 perp = vec2(-dir.y, dir.x);
  float L = uCs*(.8 + .65*h.z)*life, Wd = uCs*(.24 + .17*h.x), k = (h.y - .5)*.9;
  vec2 lc = aC.zw*vec2(L, Wd*(1. + abs(k)));
  vec2 ps = c + dir*lc.x + perp*lc.y;
  vL = lc; vP = ps; vCen = c; vS = vec4(L, Wd, k, h.y); vB = vec2(h.x, dot(perp, LGT));
  gl_Position = vec4(skyPx(ps)/uR*2. - 1., 0., 1.);
}`;
const SKY_STROKE_FS = SKY_TINT + `
uniform sampler2D uCol;
varying vec2 vL, vP, vCen; varying vec4 vS; varying vec2 vB;
void main(){
  float u = vL.x/vS.x, v = vL.y/vS.y + vS.z*u*u;
  float wp = .5 + .5*sqrt(max(0., 1. - u*u));
  float s = (1. - smoothstep(.8, 1., abs(u)))*(1. - smoothstep(.78, 1., abs(v)/wp));
  float br = sin(v*16. + vB.x*40. + u*2.5);
  s *= 1. - smoothstep(.35, 1., u)*(.55 + .45*br)*.7;
  float lp = vB.y;
  float sh = 1. + .30*v*lp - .14*v*v + .07*br + .10*pow(max(br, 0.), 6.)*(.4 + .6*max(v*lp, 0.));
  vec3 col = tint(texture2D(uCol, skyPx(mix(vP, vCen, .85))/uR).rgb, vS.w)*sh;
  gl_FragColor = vec4(col*s, s);
}`;
/* pass 4: star cores, moon and her touch-light, one quad each (premultiplied: rgb = glow*(1-a) + top*a) */
const SKY_DOT_VS = `
attribute vec2 a; uniform vec4 uQ; varying vec2 vP;
void main(){ vP = uQ.xy + a*uQ.z; gl_Position = vec4(skyPx(vP)/uR*2. - 1., 0., 1.); }`;
const SKY_DOT_FS = `
uniform vec4 uQ, uQ2; varying vec2 vP;
void main(){
  vec2 d = vP - uQ.xy; vec3 add = vec3(0.), top = vec3(0.); float a = 0.;
  if (uQ2.x < .5){ float r = length(d)/uQ2.w, br = 1. + .14*sin(uT*1.25 + uQ2.y*1.7);
    vec3 sc = uQ2.z > .5 ? vec3(1.,.86,.45) : vec3(1.,.96,.78);
    add = sc*(.22*exp(-r*.75)*br + 1.1*exp(-r*r*3.)); a = smoothstep(.55, .38, r); top = vec3(1.,.99,.92); }
  else if (uQ2.x < 1.5){ float r = length(d)/uMoon.z, br = 1. + .08*sin(uT*.9);
    add = vec3(1.,.62,.22)*(.14*exp(-r*.9)*br);
    float disc = smoothstep(1., .93, r), cut = smoothstep(.97, 1.05, length(d - vec2(.48, .2)*uMoon.z)/(uMoon.z*.86));
    a = disc*cut;
    if (a > 0.){ float n = vn(d/uMoon.z*vec2(9., 3.) + 4.); top = mix(vec3(1.,.90,.45), vec3(1.,.98,.80), n)*(1. + .08*sin(atan(d.y, d.x)*12.)); } }
  else add = vec3(1.,.86,.48)*uPtr.z*.28*exp(-dot(d, d)/.012);
  gl_FragColor = vec4(add*(1. - a) + top*a, a);
}`;
/* pass 5a (to screen, everywhere no foreground can be): just the painted sky texture, vignette and grain */
const SKY_PLAIN = `
uniform sampler2D uSky;
void main(){
  vec2 p = basePt(gl_FragCoord.xy); vec3 col = texture2D(uSky, gl_FragCoord.xy/uR).rgb;
  vec2 e = p/uE; col *= 1. - .28*smoothstep(.55, 1.5, length(e));
  col *= .95 + .1*vn(gl_FragCoord.xy*.7);
  gl_FragColor = vec4(col, 1.);
}`;
/* pass 5b (to screen, only inside the band/column where hills, village or cypress can be): the full painter */
const SKY_MAIN = SKY_TINT + `
uniform sampler2D uSky;

/* one layer of brush strokes: picks the top-most stroke covering p among the 3x3 neighbouring cells */
float strokes(vec2 p, vec2 dir, float cs, float seed, float spd, out vec2 cen, out float shade, out float jit){
  vec2 perp = vec2(-dir.y, dir.x); vec2 id = floor(p/cs);
  float best = -1., cov = 0.; shade = 1.; jit = .5; cen = p;
  float lp = dot(perp, LGT);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++){
    vec2 cid = id + vec2(float(i), float(j));
    vec4 h = h42(cid + seed);
    float ph = fract(uF*spd*(.6 + .8*h.z) + h.w);
    float life = spd > 0. ? .5 + .5*sin(3.14159*ph) : 1.;
    vec2 c = (cid + .5 + (h.xy - .5)*.9)*cs + (spd > 0. ? dir*(ph - .5)*cs*1.3 : vec2(0.));
    vec2 d = p - c;
    float L = cs*(.8 + .65*h.z)*life, Wd = cs*(.24 + .17*h.x);
    float u = dot(d, dir)/L, v = dot(d, perp)/Wd;
    v += (h.y - .5)*.9*u*u;
    float wp = .5 + .5*sqrt(max(0., 1. - u*u));
    float s = (1. - smoothstep(.8, 1., abs(u)))*(1. - smoothstep(.78, 1., abs(v)/wp));
    if (s > .002){ float pr = fract(h.w*7.31 + h.z*.37);
      if (pr > best){ best = pr; cov = s; cen = c; jit = h.y;
        float br = sin(v*16. + h.x*40. + u*2.5);
        float tail = smoothstep(.35, 1., u);
        cov *= 1. - tail*(.55 + .45*br)*.7;  /* dry-brush tail */
        shade = 1. + .30*v*lp - .14*v*v + .07*br + .10*pow(max(br, 0.), 6.)*(.4 + .6*max(v*lp, 0.)); } }
  }
  return cov;
}

vec3 fgCol(int reg, vec2 q){
  if (reg == 1){ float d = hillF(q.x) - q.y; float n = vn(q*vec2(6., 14.));
    vec3 c = mix(vec3(.30,.45,.78), vec3(.13,.23,.52), smoothstep(0., .05, d));
    c = mix(c, vec3(.12,.30,.42), smoothstep(.55, .85, n)*.6);
    return mix(c, vec3(.06,.12,.32), smoothstep(.08, .25, d)); }
  if (reg == 2){ float d = hillN(q.x) - q.y; float n = vn(q*vec2(7., 12.) + 3.);
    vec3 c = mix(vec3(.13,.27,.44), vec3(.06,.15,.26), smoothstep(0., .1, d));
    c = mix(c, vec3(.10,.25,.18), smoothstep(.45, .8, n)*.7);
    c = mix(c, vec3(.30,.44,.66), smoothstep(.72, .95, vn(q*vec2(11., 20.) + 9.))*.6);
    return c*mix(1., .5, smoothstep(.1, .5, d)); }
  float n = vn(q*vec2(14., 5.) + vec2(0., uT*.05));
  vec3 c = mix(vec3(.02,.05,.04), vec3(.10,.20,.11), n);
  c = mix(c, vec3(.22,.32,.13), smoothstep(.68, .95, vn(q*vec2(22., 7.) + 5.))*.85);
  float sx = (q.x - gCx)/max(gHw, 1e-3);
  c = mix(c, vec3(.16,.26,.42), smoothstep(.35, 1., sx)*.55);
  return mix(c, vec3(0.,.015,.02), smoothstep(.3, 1., -sx)*.5);
}

vec3 paintFG(vec2 q, int reg){
  vec2 dir; float c1 = .044, c2 = .027, sp = 0.;
  if (reg == 1){ float s = (hillF(q.x + .01) - hillF(q.x - .01))/.02; dir = normalize(vec2(1., s + .55*sin(q.x*14. + q.y*25.))); }
  else if (reg == 2) dir = normalize(vec2(1., .5*sin(q.x*9. + q.y*16.) + .15));
  else { dir = normalize(vec2(.42*sin(q.y*15. + q.x*30. + uT*.35), 1.)); c1 = .05; c2 = .03; sp = .03; }
  vec2 cen; float sh, j, cov;
  vec3 col = fgCol(reg, q)*.72;
  cov = strokes(q, dir, c1, 21.7 + float(reg), sp, cen, sh, j); if (cov > 0.) col = mix(col, tint(fgCol(reg, mix(q, cen, .85)), j)*sh, cov);
  cov = strokes(q, dir, c2, 31.3 + float(reg), sp, cen, sh, j); if (cov > 0.) col = mix(col, tint(fgCol(reg, mix(q, cen, .85)), j)*sh, cov);
  return col;
}

/* one village house (row 0 back, row 1 front); returns 1 when q hits it */
float house(vec2 q, float row, out vec3 c){
  float cw = .07 - row*.008;
  float k = floor(q.x/cw + row*.5);
  vec4 h = h42(vec2(k, row*13. + 3.));
  if (h.w*h.x > .45 || (abs(q.x - uG2.y) < .085 && row < .5)) return 0.;
  float x0 = (k - row*.5)*cw + cw*(.04 + h.x*.12), w = cw*(.6 + .3*h.y);
  float base = hillN(x0 + w*.5) - .012 - row*.04 - h.z*.018, hh = .014 + .016*h.w, rh = .011 + .01*h.x;
  float lx = q.x - x0, ly = q.y - base;
  float roof = hh + rh*(1. - abs(lx/w*2. - 1.));
  if (lx < -.004 || lx > w + .004 || ly > roof || ly < -.006) return 0.;
  if (ly <= hh && (lx < 0. || lx > w)) return 0.;
  float g = vn(q*vec2(90., 380.))*.22 + vn(q*500.)*.08;
  if (ly > hh){ c = mix(vec3(.07,.11,.28), vec3(.34,.26,.24), step(.72, h.z))*(.85 + g); if (roof - ly < .0025) c *= .4; return 1.; }
  c = mix(mix(vec3(.17,.25,.45), vec3(.30,.36,.50), h.y), vec3(.36,.38,.36), step(.8, h.x))*(.8 + g)*(row > .5 ? .85 : 1.);
  if (lx < .002 || w - lx < .002 || ly < .002) c *= .4;
  float ww = w*.16, wh = hh*.3;
  for (int k2 = 0; k2 < 2; k2++){ float wx = w*(k2 == 0 ? .2 : .62), wy = hh*.3;
    if (lx > wx && lx < wx + ww && ly > wy && ly < wy + wh && h42(vec2(k + float(k2)*.5, row)).x > .3)
      c = vec3(1.,.80,.34)*(.92 + .12*sin(uT*1.3 + k*2.1 + float(k2)));
    else c += vec3(.35,.22,.05)*exp(-length(vec2(lx - wx - ww*.5, ly - wy - wh*.5))/ww*1.4)*.5; }
  return 1.;
}
float church(vec2 q, out vec3 c){
  float x = q.x - uG2.y, base = hillN(uG2.y) - .03;
  float ly = q.y - base;

  function ang(x,y){ let vx = Math.cos(y*.011 + t*.25)*.55 + .4, vy = Math.sin(x*.009 - t*.2)*.35;

  function spawn(p){

  /* ----- foreground: hills, village, cypress (painted once, then blitted) ----- */
  function hatch(ctx, pts, cols, n, len, w){ for (let i = 0; i < n; i++){ const p = pts[Math.random()*pts.length|0]; ctx.strokeStyle = cols[Math.random()*cols.length|0]; ctx.lineWidth = w*rnd(.6,1.4); ctx.globalAlpha = rnd(.35,.8); ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.quadraticCurveTo(p[0] + rnd(-len,len), p[1] - rnd(0,len), p[0] + rnd(-len,len)*1.5, p[1] + rnd(-len,len)*.5); ctx.stroke(); } ctx.globalAlpha = 1; }
  function buildForeground(){
    const off = document.createElement('canvas'); off.width = W*fdpr; off.height = H*fdpr; const c = off.getContext('2d'); c.setTransform(fdpr,0,0,fdpr,0,0); c.lineCap = 'round';
    const hill = (base, amp, f, ph, fill, cols) => { const pts = []; c.beginPath(); c.moveTo(0,H);
      for (let x = 0; x <= W + 12; x += 12){ const y = base + Math.sin(x*f + ph)*amp + Math.sin(x*f*2.3 + ph*1.7)*amp*.35; c.lineTo(x,y); pts.push([x, y + rnd(0,(H - y)*.5)]); }

    hill(hz + m*.01, m*.05, .006, 1, '#183a86', ['#1f4aa3','#12306e','#2a5cb8','#0f2a64']);
    hill(hz + m*.09, m*.045, .008, 3, '#0f2a66', ['#16398a','#0a1f52','#1c47a0']);
    // village
    wins = []; const vy = H*.9, houses = Math.round(W/(m*.06));
    c.fillStyle = '#0a1233'; c.fillRect(0, vy, W, H - vy);
    for (let i = 0; i < houses; i++){ const x = (i + rnd(.1,.8))*W/houses, w = m*rnd(.04,.075), h = m*rnd(.03,.06);
      c.fillStyle = ['#0c1a45','#0a1538','#101f50'][i%3]; c.fillRect(x, vy - h, w, h + 4);
      c.beginPath(); c.moveTo(x - 3, vy - h); c.lineTo(x + w/2, vy - h - m*.025); c.lineTo(x + w + 3, vy - h); c.closePath(); c.fillStyle = '#081030'; c.fill();
      if (Math.random() < .8) wins.push({x:x + w*rnd(.2,.55), y:vy - h*rnd(.7,.35), s:m*.012, p:rnd(0,6.28)}); }
    const cx = W*.64; c.fillStyle = '#0a1436'; c.fillRect(cx - m*.017, vy - m*.1, m*.034, m*.1 + 4);
    c.beginPath(); c.moveTo(cx - m*.022, vy - m*.1); c.lineTo(cx, vy - m*.22); c.lineTo(cx + m*.022, vy - m*.1); c.closePath(); c.fill();
    // cypress

    for (let k = 0; k <= 24; k++){ const u = k/24, y = H - u*th, wob = Math.sin(u*9 + 1)*tw*.16*u, wd = tw*(.5*Math.sin(Math.PI*Math.pow(u,.62)) + .05); c.lineTo(tx - wd + wob, y); pts.push([tx + rnd(-wd,wd)*.8 + wob, y]); }
    for (let k = 24; k >= 0; k--){ const u = k/24, y = H - u*th, wob = Math.sin(u*9 + 1)*tw*.16*u, wd = tw*(.5*Math.sin(Math.PI*Math.pow(u,.62)) + .05); c.lineTo(tx + wd + wob, y); pts.push([tx + rnd(-wd,wd)*.8 + wob, y]); }
    c.closePath(); c.fillStyle = '#06110d'; c.fill(); hatch(c, pts, ['#0e2a1c','#173d29','#050c09','#27533a','#0b1e15'], Math.round(th*tw/90), tw*.5, m*.006);
    fgImg = off;
  }

  function drawStars(){
    smallStars.forEach(s => { const a = .35 + .65*Math.max(0, Math.sin(t*s.s + s.p)); fc.fillStyle = 'rgba(255,246,210,' + a + ')'; fc.beginPath(); fc.arc(s.x, s.y, s.r, 0, 7); fc.fill(); });

      const g = fc.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r*3.8); g.addColorStop(0, 'rgba(' + core + ',' + (.85*tw) + ')'); g.addColorStop(.4, 'rgba(255,226,110,' + (.28*tw) + ')'); g.addColorStop(1, 'rgba(255,226,110,0)');

      fc.beginPath(); fc.arc(s.x, s.y, s.r*.55, 0, 7); fc.fillStyle = 'rgba(' + core + ',1)'; fc.fill(); });
  }
  function drawMoon(){ const x = W*.86, y = H*.15, r = m*.062, pulse = 1 + Math.sin(t*1.1)*.04;
    for (let k = 4; k >= 1; k--){ fc.beginPath(); fc.arc(x, y, r*(1 + k*.5)*pulse, 0, 7); fc.strokeStyle = 'rgba(255,170,60,' + (.16 - k*.025) + ')'; fc.lineWidth = m*.012; fc.stroke(); }

/* ---------- the street: a painted night street with strings of flags (one letter each) ----------
   Shown after the camera zooms from the starry sky into the village. Brush-stroke buildings, cobbles,
   glowing windows and lanterns in the same palette as the sky, with the proposal on the flags. */
let streetRun = 0, STREET = null;
/* Everything heavy (thousands of brush strokes, cobbles, the flag strings, every flag, the glow sprites) is painted
   once, ahead of time, in small chunks. Each frame then only copies the finished street and stamps a few

function makeStreet(F){
  const run = ++streetRun, cv = $('#street'), ctx = cv.getContext('2d'), still = matchMedia('(prefers-reduced-motion: reduce)').matches, rnd = (a,b) => a + Math.random()*(b-a);
  const BLUES = ['#0a1a4f','#102a73','#16388a','#1c46a0','#244fb0','#2d5fc4','#0d2260'], WARM = ['#ffe27a','#ffd24a','#ffc14d','#fff0b0'];
  const FLAGS = [['#ff6b97','#fff'], ['#ffd166','#0b1646'], ['#f6efdc','#0b1646'], ['#5fb7ea','#0b1646'], ['#e8456f','#fff'], ['#ffb199','#0b1646']];
  let W, H, m, dpr, bg, bc, wins, lamps, rows, cw, cx0, cx1, yBase, glowW, glowL, revealAt = Infinity, doneCalled = false, total = 0, skyY = 1, stillDrawn = false, built = false;

  function brush(c, x, y, len, w, ang, col, a){ c.strokeStyle = col; c.globalAlpha = a; c.lineWidth = w; c.lineCap = 'round'; c.beginPath(); c.moveTo(x,y);
    c.quadraticCurveTo(x + Math.cos(ang + .5)*len*.5, y + Math.sin(ang + .5)*len*.5, x + Math.cos(ang)*len, y + Math.sin(ang)*len); c.stroke(); c.globalAlpha = 1; }
  function facade(c, x0, x1, yTop, yBot){
    const seg = m*.17, tops = []; for (let x = x0; x < x1; x += seg) tops.push([x, yTop + rnd(0, m*.08)]);
    c.save(); c.beginPath(); c.moveTo(x0, yBot); tops.forEach(([x,y]) => { c.lineTo(x, y); c.lineTo(Math.min(x1, x + seg), y); }); c.lineTo(x1, yBot); c.closePath();
    const g = c.createLinearGradient(x0,0,x1,0); g.addColorStop(0,'#091748'); g.addColorStop(1,'#15338f'); c.fillStyle = g; c.fill(); c.clip();
    const n = (x1 - x0)*(yBot - yTop)/140; for (let i = 0; i < n; i++) brush(c, rnd(x0,x1), rnd(yTop,yBot), rnd(m*.025,m*.07), rnd(m*.007,m*.016), -1.57 + rnd(-.45,.45), BLUES[Math.random()*BLUES.length|0], rnd(.3,.8));
    tops.forEach(([x,y]) => { c.fillStyle = '#050d2e'; c.fillRect(x - 1, y - m*.014, seg + 2, m*.024); for (let k = 0; k < 8; k++) brush(c, x + rnd(0,seg), y + rnd(-6,10), rnd(8,20), rnd(2,4), rnd(-.3,.3), '#1b3a97', .7); });
    const ww = m*.052, wh = m*.078, gx = m*.12, gy = m*.15;
    for (let y = yTop + m*.24; y < yBot - wh*1.4; y += gy) for (let x = x0 + m*.035; x < x1 - ww; x += gx){
      if (Math.random() < .1) continue; const lit = Math.random() < .7;
      c.fillStyle = '#050d2e'; c.fillRect(x - 3, y - 3, ww + 6, wh + 6);
      c.fillStyle = lit ? WARM[Math.random()*WARM.length|0] : '#12286c'; c.fillRect(x, y, ww, wh);
      if (lit){ wins.push({x:x + ww/2, y:y + wh/2, r:ww*1.7, p:rnd(0,6.28)}); for (let k = 0; k < 6; k++) brush(c, x + rnd(0,ww), y + rnd(0,wh), rnd(ww*.3,ww*.7), rnd(2,4), rnd(-.4,.4), WARM[Math.random()*WARM.length|0], .7); }
      c.fillStyle = '#050d2e'; c.fillRect(x + ww/2 - 1.2, y, 2.4, wh); c.fillRect(x, y + wh/2 - 1.2, ww, 2.4); }

  function distant(c){ const x0 = cx0 + cw*.12, x1 = cx1 - cw*.12, yb = yBase, n = 6;
    for (let i = 0; i < n; i++){ const w = (x1 - x0)/n, x = x0 + i*w, h = m*rnd(.07,.13), y = yb - h;
      c.fillStyle = ['#0a1a50','#0c1f5a','#08153f'][i % 3]; c.fillRect(x, y, w + 1, h);
      c.beginPath(); c.moveTo(x - 2, y); c.lineTo(x + w/2, y - m*.04); c.lineTo(x + w + 3, y); c.closePath(); c.fillStyle = '#060f33'; c.fill();
      for (let k = 0; k < 2; k++){ const wx = x + w*(.25 + k*.4), wy = y + h*.35; c.fillStyle = WARM[Math.random()*WARM.length|0]; c.fillRect(wx, wy, w*.16, h*.22); wins.push({x:wx + w*.08, y:wy + h*.11, r:w*.34, p:rnd(0,6.28)}); } }
    const sx = (x0 + x1)/2; c.fillStyle = '#071142'; c.fillRect(sx - m*.012, yb - m*.24, m*.024, m*.24); c.beginPath(); c.moveTo(sx - m*.02, yb - m*.24); c.lineTo(sx, yb - m*.34); c.lineTo(sx + m*.02, yb - m*.24); c.fill(); }
  function road(c){ const g = c.createLinearGradient(0,yBase,0,H); g.addColorStop(0,'#1a3a92'); g.addColorStop(1,'#091850'); c.fillStyle = g; c.fillRect(0, yBase, W, H - yBase);
    let y = yBase, r = 0; while (y < H){ const k = (y - yBase)/(H - yBase), h = m*(.014 + k*.05), cwid = m*(.04 + k*.1); for (let x = -cwid + (r % 2 ? cwid/2 : 0); x < W + cwid; x += cwid){
        c.globalAlpha = .9; c.fillStyle = BLUES[Math.random()*BLUES.length|0]; c.beginPath(); c.ellipse(x + cwid/2 + rnd(-2,2), y + h/2, cwid*.46, h*.5, 0, 0, 7); c.fill(); if (Math.random() < .12){ c.fillStyle = 'rgba(255,215,120,.35)'; c.fill(); } }
      y += h*1.04; r++; } c.globalAlpha = 1; }
  function lampPost(c, x){ c.fillStyle = '#050d2e'; c.fillRect(x - 3, yBase - m*.22, 6, m*.22); c.fillRect(x - m*.02, yBase - m*.255, m*.04, m*.035); lamps.push({x, y:yBase - m*.238, r:m*.2, p:rnd(0,6.28)}); }
  function strings(c){ rows.forEach(r => { const xa = cx0 + 2, xb = cx1 - 2;            // the flag strings never move, so they are part of the painted street
    c.strokeStyle = '#07102e'; c.lineWidth = 2; c.beginPath(); for (let k = 0; k <= 30; k++){ const u = k/30, x = xa + (xb - xa)*u, y = r.y + 4*r.sag*u*(1 - u); k ? c.lineTo(x,y) : c.moveTo(x,y); } c.stroke(); }); }
  function layoutFlags(){
    const lines = F.lines.map(s => s.toUpperCase()), nl = lines.length, maxN = Math.max(...lines.map(s => s.length));
    const top = H*.17, bot = H*.66, gap = nl > 1 ? (bot - top)/(nl - 1) : H, fw = Math.min(cw/(maxN + 1.6), m*.09, 54, (gap - H*.03)/1.32); rows = [];
    lines.forEach((s, i) => { const y = nl === 1 ? (top + bot)/2 : top + (bot - top)*i/(nl - 1), items = [];
      [...s].forEach((ch, k) => { if (ch !== ' ') items.push({ch, u:.5 + (k - (s.length - 1)/2)*(fw*1.1)/cw, col:FLAGS[(i*3 + k) % FLAGS.length], p:rnd(0,6.28)}); });
      rows.push({y, fw, items, sag:H*.04}); });
    total = 0; rows.forEach(r => r.items.forEach(it => { it.at = total*F.letterMs; total++; })); }
  function shade(hex){ const n = parseInt(hex.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255, k = .78; return 'rgb(' + (r*k|0) + ',' + (g*k|0) + ',' + (b*k|0) + ')'; }
  function flagSprite(it, fw){            // each flag is painted once (same drawing as before) at a resolution that stays sharp through the pop-in overshoot
    const fh = fw*1.28, pad = Math.ceil(fw*.12) + 2, k = dpr*1.35, w = fw + pad*2, h = fh + pad*2;
    const c = document.createElement('canvas'); c.width = Math.ceil(w*k); c.height = Math.ceil(h*k); const x = c.getContext('2d');
    x.setTransform(k, 0, 0, k, (pad + fw/2)*k, pad*k);
    x.beginPath(); x.moveTo(-fw/2, 0); x.lineTo(fw/2, 0); x.lineTo(0, fh); x.closePath();
    const g = x.createLinearGradient(0,0,0,fh); g.addColorStop(0, it.col[0]); g.addColorStop(1, shade(it.col[0])); x.fillStyle = g; x.fill();
    x.save(); x.clip(); x.lineCap = 'round'; for (let j = 0; j < 5; j++){ x.strokeStyle = 'rgba(255,255,255,.22)'; x.lineWidth = fw*.07; x.beginPath(); x.moveTo(-fw*.4 + j*fw*.2, fh*.05); x.lineTo(-fw*.3 + j*fw*.15, fh*.7); x.stroke(); } x.restore();
    x.lineWidth = Math.max(1.4, fw*.045); x.strokeStyle = '#08102f'; x.lineJoin = 'round'; x.stroke();
    x.fillStyle = it.col[1]; x.font = '700 ' + (fw*.56) + 'px Georgia,"Times New Roman",serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(it.ch, 0, fh*.3);
    it.spr = c; it.ox = pad + fw/2; it.oy = pad; it.sw = c.width/k; it.sh = c.height/k; }
  function glowSprite(col){ const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d'), g = x.createRadialGradient(64,64,0,64,64,64);
    g.addColorStop(0, 'rgba(' + col + ',1)'); g.addColorStop(1, 'rgba(' + col + ',0)'); x.fillStyle = g; x.fillRect(0,0,128,128); return c; }
  function coverDepth(){                  // how far down the street still lets the sky show through (the sky need not be painted below that)
    const sw = 48, sh = 96, s = document.createElement('canvas'); s.width = sw; s.height = sh; const x = s.getContext('2d', {willReadFrequently:true});
    x.drawImage(bg, 0, 0, sw, sh); const d = x.getImageData(0, 0, sw, sh).data; let maxY = 0;
    for (let y = 0; y < sh; y++) for (let i = 0; i < sw; i++) if (d[(y*sw + i)*4 + 3] < 252){ maxY = y + 1; break; }
    return Math.min(1, (maxY + 2)/sh); }

  const steps = () => [
    () => { dpr = Math.min(window.devicePixelRatio || 1, 1.5); W = innerWidth; H = innerHeight; m = Math.min(W,H);
      cw = Math.min(W*.76, 620); cx0 = (W - cw)/2; cx1 = cx0 + cw; yBase = H*.8; wins = []; lamps = [];
      bg = document.createElement('canvas'); bg.width = Math.round(W*dpr); bg.height = Math.round(H*dpr); bc = bg.getContext('2d'); bc.setTransform(dpr,0,0,dpr,0,0);
      layoutFlags(); distant(bc); },
    () => facade(bc, -m*.1, cx0 + cw*.03, rows[0].y - m*.17, yBase),      // rooflines rise above the top string of flags
    () => facade(bc, cx1 - cw*.03, W + m*.1, rows[0].y - m*.21, yBase),
    () => { road(bc); lampPost(bc, cx0 + cw*.1); lampPost(bc, cx1 - cw*.1); strings(bc); },
    () => { glowW = glowW || glowSprite('255,205,90'); glowL = glowL || glowSprite('255,196,92'); rows.forEach(r => r.items.forEach(it => flagSprite(it, r.fw))); },
    () => { skyY = coverDepth(); cv.width = bg.width; cv.height = bg.height; built = true; stillDrawn = false; }
  ];

  function flag(it, x, y, fw, now){
    const age = still ? 1e9 : now - revealAt - it.at; if (age < 0) return;
    const p = Math.min(1, age/520), s = p < 1 ? 1 + 2.2*Math.pow(p - 1, 3) + 1.2*Math.pow(p - 1, 2) : 1;   // pop in with a little overshoot
    const sway = still ? 0 : Math.sin(now/700 + it.p)*.09, c = Math.cos(sway)*s*dpr, sn = Math.sin(sway)*s*dpr;
    ctx.setTransform(c, sn, -sn, c, x*dpr, (y - (1 - Math.min(1,p*1.6))*fw*1.2)*dpr); ctx.drawImage(it.spr, -it.ox, -it.oy, it.sw, it.sh); }
  function frame(now){
    if (run !== streetRun || !built) return;
    if (still){ if (stillDrawn) return; stillDrawn = true; }
    ctx.setTransform(1,0,0,1,0,0); ctx.globalCompositeOperation = 'copy'; ctx.drawImage(bg, 0, 0); ctx.globalCompositeOperation = 'source-over';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    for (const w of wins){ ctx.globalAlpha = still ? .28 : .22 + .12*Math.sin(now/900 + w.p); ctx.drawImage(glowW, w.x - w.r, w.y - w.r, w.r*2, w.r*2); }
    for (const l of lamps){ const f = still ? .6 : .55 + .15*Math.sin(now/400 + l.p) + .06*Math.sin(now/130 + l.p*2); ctx.globalAlpha = f*.75; ctx.drawImage(glowL, l.x - l.r, l.y - l.r, l.r*2, l.r*2); }
    ctx.globalAlpha = 1; ctx.fillStyle = '#fff1b8'; ctx.beginPath(); for (const l of lamps){ ctx.moveTo(l.x + m*.012, l.y); ctx.arc(l.x, l.y, m*.012, 0, 7); } ctx.fill();
    for (const r of rows){ const xa = cx0 + 2, xb = cx1 - 2; for (const it of r.items) flag(it, xa + (xb - xa)*it.u, r.y + 4*r.sag*it.u*(1 - it.u), r.fw, now); }
    ctx.setTransform(1,0,0,1,0,0);
    if (!doneCalled && now > revealAt + total*F.letterMs + 600){ doneCalled = true; F.onRevealed && F.onRevealed(); }
  }
  let rs; window.addEventListener('resize', () => { clearTimeout(rs); rs = setTimeout(() => { if (run === streetRun){ built = false; steps().forEach(f => f()); frame(performance.now()); } }, 250); });
  return { steps, frame, cover: () => skyY, begin(t0){ revealAt = t0 + F.zoomStartMs + F.zoomMs + 500; F.revealAt = () => revealAt; } };
}
function prepareStreet(F){
  if (prepareStreet.p) return prepareStreet.p;
  STREET = makeStreet(F); const st = STREET.steps(); let i = 0;
  return prepareStreet.p = new Promise(res => (function next(){ if (i < st.length){ st[i++](); nextTask(next); } else res(); })());
}

/* ---------- the finale: prepared ahead of time, then played by ONE animation loop ---------- */
function prepareFinale(){
  if (prepareFinale.p) return prepareFinale.p;
  const F = CONFIG.finale, dpr = window.devicePixelRatio || 1;
  const hearts = new Promise(res => { let i = 0; (function next(){ if (i < F.hearts.length){ const h = F.hearts[i++]; SIZES.forEach(s => sprite(h, s, dpr)); nextTask(next); } else res(); })(); });
  return prepareFinale.p = prepareSky().then(ok => prepareStreet(F).then(() => hearts).then(() => ok));
}
function cubicBezier(x1, y1, x2, y2){       // the same curve the old CSS transition used
  const B = (a, b, t) => 3*a*t*(1 - t)*(1 - t) + 3*b*t*t*(1 - t) + t*t*t;
  return x => { if (x <= 0) return 0; if (x >= 1) return 1; let lo = 0, hi = 1, t = x; for (let i = 0; i < 22; i++){ t = (lo + hi)/2; if (B(x1, x2, t) < x) lo = t; else hi = t; } return B(y1, y2, t); };
}
function playFinale(F, glOK){
  const t0 = performance.now(), ZOOM = 2.7, ease = cubicBezier(.5,.02,.2,1), still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const st = STREET || {begin(){}, frame(){}, cover: () => 1}, scv = $('#street'), clamp = v => v < 0 ? 0 : v > 1 ? 1 : v;
  let zoom2D = false, rained = false, op = -1, sc = -1;
  const go2D = () => { skyTo2D(); document.querySelectorAll('.czoom').forEach(e => e.style.transitionDuration = '1.2s,' + F.zoomMs/1000 + 's'); };
  if (!glOK) go2D();
  else if (SKYGL) SKYGL.onLost = () => { SKYGL = null; go2D(); zoom2D = false; };
  document.body.classList.add('skyon');              // 1. the starry night fades in
  st.begin(t0);
  (function loop(now){
    const e = now - t0;
    // 2. the camera moves in toward the village: eased, time-based, rendered inside the shader so every frame is sharp
    const zp = still ? 0 : clamp((e - F.zoomStartMs)/F.zoomMs), zoom = Math.pow(ZOOM, ease(zp));
    // 3. the street dissolves in while the camera is still moving, and keeps gliding forward a little until it settles
    const d = clamp((e - F.zoomStartMs - .55*F.zoomMs)/(.45*F.zoomMs + 200)), o = d*d*(3 - 2*d), s = still ? 1 : 1 - .07*Math.pow(1 - d, 3);
    if (o !== op){ scv.style.opacity = o.toFixed(4); op = o; }
    if (s !== sc){ scv.style.transform = s < 1 ? 'scale(' + s.toFixed(4) + ')' : 'none'; sc = s; }
    if (SKYGL) SKYGL.frame(now, zoom, o >= 1 && s >= 1 ? st.cover() : 1);
    else if (!zoom2D && !still && e >= F.zoomStartMs){ zoom2D = true; document.body.classList.add('zoom'); }
    if (o > 0) st.frame(now);
    if (!rained && e >= F.zoomStartMs + F.zoomMs + 400){ rained = true; rain(F.hearts, {loop:true, count:24}); }   // 4. hearts start falling as the flags pop in
    requestAnimationFrame(loop);
  })(t0);
}

function buildKb(box, onKey){
  box.innerHTML = '';
  ['QWERTYUIOP','ASDFGHJKL','↵ZXCVBNM⌫'].forEach(r => {
    const row = el('div','kbrow');
    [...r].forEach(k => {
      const b = el('button','key' + ('↵⌫'.includes(k) ? ' wide' : ''), k === '↵' ? 'ENTER' : k);
      b.dataset.k = k;
      b.onclick = () => { b.blur(); onKey(k === '↵' ? 'Enter' : k === '⌫' ? 'Backspace' : k); };
      row.append(b);
    });
    box.append(row);
  });
}
document.addEventListener('keydown', e => {
  if (!activeKey || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[a-zA-Z]$/.test(e.key)) activeKey(e.key.toUpperCase());
  else if (['Enter','Backspace'].includes(e.key)) { e.preventDefault(); activeKey(e.key); }
});

const INIT = {
  intro(){
    const box = $('#nameTiles'), tr = el('div','trow'); box.style.setProperty('--n', 5); box.style.setProperty('--rows', 1);
    [...(CONFIG.herName || 'HELLO').toUpperCase().slice(0,7)].forEach((ch,i) => { const t = el('div','tile correct', ch); tr.append(t); });
    box.append(tr);
    $('#startBtn').onclick = () => { loadSongs(); show('wordle'); setTimeout(prepareFinale, 400); };   // get the finale ready in the background while she plays
  },

  /* ---------------- WORDLE ---------------- */
  wordle(){
    const ans = CONFIG.wordle.answer.toUpperCase(), n = ans.length, R = 6;
    const board = $('#wBoard'); board.style.setProperty('--n', n);
    let row = 0, cur = '', busy = false, rows = [];
    function build(){ board.innerHTML = ''; rows = []; row = 0; cur = '';
      for (let r = 0; r < R; r++){ const tr = el('div','trow'); const ts = []; for (let i = 0; i < n; i++){ const t = el('div','tile'); tr.append(t); ts.push(t); } board.append(tr); rows.push({tr, ts}); } }
    function paint(){ rows[row].ts.forEach((t,i) => { t.textContent = cur[i] || ''; t.classList.toggle('filled', !!cur[i]); }); }
    function score(g){ const res = Array(n).fill('absent'), cnt = {};
      for (let i = 0; i < n; i++){ if (g[i] === ans[i]) res[i] = 'correct'; else cnt[ans[i]] = (cnt[ans[i]]||0) + 1; }
      for (let i = 0; i < n; i++){ if (res[i] !== 'correct' && cnt[g[i]] > 0){ res[i] = 'present'; cnt[g[i]]--; } }
      return res; }
    function submit(){
      busy = true; const g = cur, res = score(g), ts = rows[row].ts;
      ts.forEach((t,i) => setTimeout(() => { t.classList.add('flip'); setTimeout(() => t.classList.add(res[i]), 250); }, i*280));
      setTimeout(() => {
        [...g].forEach((ch,i) => { const k = $(`#wKb [data-k="${ch}"]`); if (!k) return;
          if (res[i] === 'correct') k.className = 'key correct';
          else if (res[i] === 'present' && !k.classList.contains('correct')) k.className = 'key present';
          else if (res[i] === 'absent' && !k.classList.contains('correct') && !k.classList.contains('present')) k.className = 'key absent'; });
        if (g === ans) return dogMoment();
        row++; cur = '';
        if (row === R){ flash('#wMsg', CONFIG.wordle.hint || 'So close. Try again!', 0); setTimeout(() => { build(); busy = false; }, 1600); }
        else busy = false;
      }, n*280 + 400);
    }
    KEYS.wordle = activeKey = k => {
      if (busy) return;
      if (k === 'Backspace') cur = cur.slice(0,-1);
      else if (k === 'Enter'){ if (cur.length < n){ flash('#wMsg','Not enough letters'); rows[row].tr.classList.remove('shake'); void rows[row].tr.offsetWidth; rows[row].tr.classList.add('shake'); } else return submit(); }
      else if (k.length === 1 && cur.length < n){ cur += k; const t = rows[row].ts[cur.length-1]; t.classList.remove('pop'); void t.offsetWidth; t.classList.add('pop'); }
      paint();
    };
    build(); buildKb($('#wKb'), k => activeKey && activeKey(k));
  },

  /* ---------------- THE QUESTION ---------------- */
  finale(){
    const F = CONFIG.finale;
    document.body.classList.add('night');
    F.onRevealed = () => rain(F.hearts, {loop:true, count:60});       // a bigger heart shower once the banner is complete
    F.hearts.forEach(h => SIZES.forEach(s => sprite(h, s, window.devicePixelRatio || 1)));   // already cached if prepared at Play; else done now, before anything moves
    // normally everything was prepared while she played; if not (e.g. ?stage=finale) it is prepared now, then played
    prepareFinale().then(ok => playFinale(F, ok), err => { console.warn(err); playFinale(F, false); });
  }
};

// For your own testing: add ?stage=finale to the address to jump straight to the question.
const jump = new URLSearchParams(location.search).get('stage');
show(ORDER.includes(jump) ? jump : 'intro');
</script>
